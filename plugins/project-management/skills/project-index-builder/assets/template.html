<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Project Index</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: two-pane explorer. Left: layers and domains (name and count only). Right: one domain at a time, grouped by type. */
:root{
  /* Neutral defaults. Replace with the project's design system tokens. */
  --bg:#F7F8FA; --surface:#FFFFFF; --ink:#16181D; --muted:#4B5260; --faint:#6B7280; --line:#E3E6EB;
  --accent:#2F5BD3; --accent-soft:#2F5BD31F; --ok:#0E7A55; --lock:#B42318;
  --st-triage:#C2410C; --st-backlog:#8A96A6; --st-todo:#4F5D73; --st-progress:#0B6BCB; --st-review:#7346D6; --st-done:#0E7A55; --st-canceled:#A3ACB9;
  --display:"Inter","Helvetica Neue",Arial,sans-serif;
  --body:"Inter","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1115; --surface:#181B21; --ink:#F2F4F7; --muted:#C3C8D1; --faint:#9AA1AD; --line:#ffffff1f;
  --accent:#7C9CFF; --accent-soft:#7C9CFF26; --ok:#4CC79A; --lock:#F97066;
  --st-triage:#F08A5D; --st-backlog:#7D8CA3; --st-todo:#A9B6CB; --st-progress:#5CB2FF; --st-review:#A98BF5; --st-done:#4CC79A; --st-canceled:#55637C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1115; --surface:#181B21; --ink:#F2F4F7; --muted:#C3C8D1; --faint:#9AA1AD; --line:#ffffff1f;
  --accent:#7C9CFF; --accent-soft:#7C9CFF26; --ok:#4CC79A; --lock:#F97066;
  --st-triage:#F08A5D; --st-backlog:#7D8CA3; --st-todo:#A9B6CB; --st-progress:#5CB2FF; --st-review:#A98BF5; --st-done:#4CC79A; --st-canceled:#55637C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding-block:16px}
.brand{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.02em;margin:0;white-space:nowrap}
.brand span{color:var(--muted);font-weight:600}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.search:focus-within{border-color:var(--accent)}
.search svg{flex:none;color:var(--faint)}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;padding:10px 0;outline:none}
.search kbd{font-family:var(--mono);font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 5px}

.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:48px;padding-block:28px 56px}
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);align-self:start;display:flex;flex-direction:column;gap:18px;height:calc(100dvh - 92px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.navhome{font-weight:500;padding:6px 10px;border-radius:8px;width:100%}
.layer p{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 4px 10px}
.dom{display:flex;justify-content:space-between;gap:8px;width:100%;padding:6px 10px;border-radius:8px;color:var(--muted)}
.dom span{font-family:var(--mono);font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.dom:hover,.navhome:hover{color:var(--ink);background:var(--surface)}
.dom.on,.navhome.on{color:var(--ink);background:var(--surface);font-weight:500;box-shadow:0 0 0 1px var(--line)}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr);gap:20px;padding-block:16px 48px}
  nav{position:static;flex-direction:row;overflow-x:auto;overflow-y:visible;gap:6px;padding-bottom:6px;height:auto}
  .layer{display:contents}.layer p{display:none}
  .dom,.navhome{flex:none;width:auto;border:1px solid var(--line);background:var(--surface)}
}

.view h1{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.025em;margin:0;text-wrap:balance}
.view .lead{color:var(--muted);margin:6px 0 0;max-width:60ch}
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;margin-top:20px}
.audsel{display:flex;gap:4px;font-size:13px}
.audsel button{padding:4px 10px;border-radius:999px;color:var(--muted)}
.audsel button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.count{font-size:13px;color:var(--faint)}

.start{position:relative;display:block;margin-top:24px;padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.start:hover{border-color:var(--accent)}
.start .info{position:absolute;z-index:1;top:8px;right:8px;margin:0}
.start .card-title{color:inherit}
.start small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:500}
.start b{display:block;font-family:var(--display);font-size:18px;font-weight:700;margin:4px 40px 0 0;letter-spacing:-.01em}
.start span{display:block;color:var(--muted);font-size:14px;margin-top:2px}

.group{margin-top:32px}
.group h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:500;margin:0 0 6px}
.row{position:relative;display:grid;grid-template-columns:20px minmax(0,1fr);gap:0 12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.ftype{color:var(--faint);padding-top:2px;display:grid}
.ftype svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.row:hover .ftype{color:var(--accent)}
.rbody{min-width:0}
.titleline{display:flex;align-items:flex-start;gap:8px;min-width:0}
.row-title{font-weight:500;overflow-wrap:anywhere;text-decoration:none;color:var(--ink);flex:1;min-width:0}
.row-title::after{content:"";position:absolute;inset:0}
span.row-title{color:var(--muted)}
span.row-title::after{content:none}
a.row-title:hover{color:var(--accent)}
.info{position:relative;z-index:1;flex:none;display:grid;place-items:center;width:40px;height:40px;margin:-9px -8px -9px 0;color:var(--faint);border-radius:8px}
.info:hover{color:var(--accent);background:var(--accent-soft)}
.info svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.row .no{display:block;color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;font-size:12px;color:var(--faint);margin-top:2px}
.meta time{font-family:var(--mono);font-variant-numeric:tabular-nums}
.flag{font-size:12px;font-weight:500}
.flag.cliente{color:var(--ok)}.flag.conf{color:var(--lock)}
.new{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;margin-left:8px;vertical-align:middle}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.more{margin-top:20px;font-size:13px;color:var(--muted)}
.more:hover{color:var(--accent)}

.entry{display:grid;grid-template-columns:200px minmax(0,1fr);gap:4px 20px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.entry button{color:var(--muted);font-size:14px}
.entry button:hover{color:var(--accent)}
.entry a{font-weight:500;text-decoration:none;overflow-wrap:anywhere}
.entry a:hover{color:var(--accent)}
@media (max-width:560px){.entry{grid-template-columns:minmax(0,1fr)}}
.empty{margin-top:24px;padding:32px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.empty strong{display:block;color:var(--ink);font-family:var(--display);margin-bottom:4px}
footer{color:var(--faint);font-size:12px;padding-block:0 32px}
.scrim{position:fixed;inset:0;background:rgba(8,17,31,.28);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:21;overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 20px) max(24px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) 24px;box-shadow:-12px 0 32px rgba(8,17,31,.12)}
.drawer .close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:max(16px,env(safe-area-inset-right,0px));font-size:22px;line-height:1;color:var(--muted);padding:6px}
.drawer .eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 40px 6px 0}
.drawer h2{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.02em;margin:0 32px 6px 0;overflow-wrap:anywhere;text-wrap:balance}
.drawer .desc{color:var(--muted);margin:0}
.open{display:inline-flex;gap:6px;align-items:center;margin-top:16px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:500;font-size:14px;padding:8px 14px;border-radius:8px}
.open:hover{background:var(--accent);color:#fff}
.drawer dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px 16px;margin:24px 0 0;padding-top:20px;border-top:1px solid var(--line);font-size:14px}
.drawer dt{color:var(--faint)}
.drawer dd{margin:0;overflow-wrap:anywhere}
.drawer dd.na{color:var(--faint);font-style:normal}
.drawer .url{font-family:var(--mono);font-size:12px;color:var(--muted)}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dom .lb,.navhome{display:flex;align-items:center;gap:10px;min-width:0}
.dom .ic,.navhome .ic{color:var(--faint)}
.dom.on .ic,.navhome.on .ic,.dom:hover .ic{color:var(--accent)}
.view h1{display:flex;align-items:center;gap:12px}
.h1ic{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;background:var(--accent-soft);color:var(--accent);flex:none}
.h1ic .ic{width:20px;height:20px}
.group h2{display:flex;align-items:center;gap:8px}
.group h2 .ic{width:14px;height:14px}
.logo{display:flex;align-items:center;gap:12px}
.logo img{height:22px;width:auto;display:block}
:root:not([data-theme="dark"]) .logo img.white{filter:brightness(0) saturate(100%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo img.white{filter:none}}
.wordmark{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.03em;color:var(--ink)}
.logo .sep{width:1px;height:18px;background:var(--line)}
.logo .sub{font-family:var(--display);font-weight:600;font-size:15px;color:var(--muted);white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
@media (max-width:640px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{position:relative;display:flex;flex-direction:column;gap:10px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0;text-align:left}
.card .top{margin:-6px -8px 0 0}
.card-title{text-decoration:none;color:inherit}
.card-title::after{content:"";position:absolute;inset:0;border-radius:12px}
.card .info{margin:0}
.card:hover{border-color:var(--accent)}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .num{font-family:var(--mono);font-size:12px;color:var(--faint);margin-left:auto}
.card small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:500}
.card b{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;line-height:1.3;overflow-wrap:anywhere}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .foot{margin-top:auto;padding-top:6px;font-size:12px;color:var(--faint);display:flex;gap:10px;flex-wrap:wrap}

nav{overflow-y:auto}
.navtop{display:flex;flex-direction:column;gap:2px}
@media (max-width:820px){.navtop{display:contents}}
.navhome .nd{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--faint)}
.eyebrow2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0}
.health{font-weight:700;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-size:14px;font-weight:500;text-align:center}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.55;cursor:default}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.pri:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ico{width:40px;padding:0}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
.strip{margin-top:24px;padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.strip .sh{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em;line-height:1.35;margin:6px 0 0;text-wrap:balance}
.su{list-style:none;counter-reset:u;margin:12px 0 16px;padding:0;display:grid;gap:6px}
.su li{counter-increment:u;display:flex;flex-wrap:wrap;gap:0 10px;font-size:14px}
.su li::before{content:counter(u);font-family:var(--mono);font-size:12px;color:var(--accent);width:18px}
.su li span{flex:1;min-width:0}
.su li em{font-style:normal;color:var(--faint)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.tabs button{min-height:36px;padding:0 12px;border-radius:999px;color:var(--muted);font-family:var(--mono);font-size:13px;border:1px solid var(--line);background:var(--surface)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sum{margin-top:20px;padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.sum .hl{font-family:var(--display);font-weight:800;font-size:23px;letter-spacing:-.02em;line-height:1.3;margin:8px 0 0;text-wrap:balance}
.sum .why{color:var(--muted);margin:10px 0 0}
.counts{display:flex;flex-wrap:wrap;gap:4px 20px;margin:16px 0 0;font-size:13px;color:var(--muted)}
.counts b{color:var(--ink);font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.sec{margin-top:32px}
.sec>h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:500;margin:0 0 4px}
.none{color:var(--faint);font-size:14px;margin:8px 0}
.ucards{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:12px}
.ucard{display:grid;grid-template-columns:30px minmax(0,1fr);gap:0 14px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.unum{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-family:var(--mono);font-size:13px}
.ubody{min-width:0}
.ut{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;line-height:1.35;margin:2px 0 0}
.uw{color:var(--muted);margin:4px 0 0;font-size:14px}
.umeta{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:12.5px;color:var(--faint);margin-top:8px}
.umeta a{color:var(--muted)}
.umeta a:hover{color:var(--accent)}
.umeta .late{color:var(--lock);font-weight:500}
.umeta time{font-family:var(--mono)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.draft{margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.draft pre{white-space:pre-wrap;font:inherit;margin:6px 0 0;overflow-wrap:anywhere;min-height:1.5em}
.draft .fb{width:100%;margin-top:6px;font:12px/1.5 var(--mono);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical}
.asg{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:10px;font-size:13px;color:var(--muted)}
.asg a{color:var(--ink);font-weight:500}
.asg .na2{color:var(--lock)}
.msg{font-size:13px;color:var(--lock);margin:6px 0 0}
.asg .msg{margin:0}
details.full{margin-top:32px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.full>summary{cursor:pointer;list-style:none;padding:16px 20px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;font-family:var(--display);font-weight:700;font-size:16px;min-height:48px}
details.full>summary::-webkit-details-marker{display:none}
details.full>summary::before{content:"";flex:none;width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);align-self:center;margin-right:2px}
details.full[open]>summary::before{transform:rotate(45deg)}
@media (prefers-reduced-motion:no-preference){details.full>summary::before{transition:transform .15s}}
details.full>summary small{font-family:var(--body);font-weight:400;font-size:13px;color:var(--faint)}
details.full[open]>summary{border-bottom:1px solid var(--line)}
.fbody{padding:4px 20px 22px}
details.full+details.full{margin-top:12px}
.fbody>.ucards,.fbody>.ms,.fbody>.ls,.fbody>.wkacts,.fbody>.none{margin-top:18px}
.stc{display:inline-flex;align-items:center;gap:6px;font-weight:500;color:var(--stc)}
.stc>i{width:8px;height:8px;border-radius:50%;background:var(--stc);flex:none}
.st-triage{--stc:var(--st-triage)}.st-backlog{--stc:var(--st-backlog)}.st-todo{--stc:var(--st-todo)}.st-progress{--stc:var(--st-progress)}.st-review{--stc:var(--st-review)}.st-done{--stc:var(--st-done)}.st-canceled{--stc:var(--st-canceled)}
.stf{border:0;margin:18px 0 4px;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.stf legend{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:0;margin-bottom:8px}
.stf{gap:4px 18px}
.stf label{padding:4px 0;min-height:32px;cursor:pointer;font-size:13px}
.stf label>i{display:none}
.stf label b{font-family:var(--mono);font-weight:500;color:var(--faint);font-size:12px}
.stf input{margin:0;accent-color:var(--stc)}
.stf label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
body.fsv header,body.fsv nav{display:none}
body.fsv .wrap{max-width:none}
body.fsv .layout{grid-template-columns:minmax(0,1fr);gap:0;padding-block:16px 40px}
.bhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.bhead h1{font-size:24px;display:flex;align-items:center;gap:10px}
.bctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:16px}
.blab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.bctl .btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.bkn{font-family:var(--mono);font-weight:500;color:var(--faint);font-size:12px}
.bsum{font-size:13px;color:var(--faint);margin-left:auto}
.kown{font-size:11.5px;color:var(--muted);margin-left:auto}
.tscroll{overflow-x:auto;margin-top:14px}
.agg th.n2,.agg td.n2{text-align:right;white-space:nowrap}
.agg td.n2.late{color:var(--lock);font-weight:500}
.agg .pw{display:flex;align-items:center;gap:8px;white-space:nowrap;min-width:150px}
.bar2{width:70px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:none}

async function setFav(id,on){
  const it=items.find(i=>i._id===id);if(!it||!DB)return false;
  try{
    if(on){const max=Math.max(0,...items.filter(isFav).map(i=>Number(i.inicio)));await DB.collection("items").doc(id).update({inicio:max+1})}
    else await DB.collection("items").doc(id).update({inicio:{__delete__:true},inicio_label:{__delete__:true},inicio_desc:{__delete__:true}});
    return true;
  }catch(e){FV.msg=BRAND.ui.saveErr;FV.err=true;render();return false}
}
async function moveFav(id,d){
  const l=favList(),i=l.findIndex(x=>x._id===id),j=i+d;if(i<0||j<0||j>=l.length||!DB)return;
  try{
    // Renumera en orden 1..n con el intercambio aplicado
    const order=l.map(x=>x._id);[order[i],order[j]]=[order[j],order[i]];
    for(let k=0;k<order.length;k++){const x=l.find(y=>y._id===order[k]);if(Number(x.inicio)!==k+1)await DB.collection("items").doc(order[k]).update({inicio:k+1})}
  }catch(e){FV.msg=BRAND.ui.reorderErr;FV.err=true;render()}
}
async function favPrompt(text){
  const t=norm(text).trim();if(!t)return;
  FV.text=text;FV.matches=[];FV.err=false;
  const quitar=new RegExp("\\b("+BRAND.ui.nlRemoveWords+")\\b").test(t);
  const query=t.replace(new RegExp("\\b("+BRAND.ui.nlStopWords+")\\b","g")," ").replace(/\s+/g," ").trim();
  const pool=items.filter(i=>vig(i)&&(quitar?isFav(i):true));
  const toks=query.split(" ").filter(w=>w.length>1);
  let hits=toks.length?pool.filter(i=>{const h=norm([i.titulo,i.nota,i.tipo].join(" "));return toks.every(w=>h.includes(w))}):[];
  if(!hits.length&&toks.length){
    let sample=null;try{sample=await claude.use("sample")}catch(_){}
    if(sample){
      FV.busy=true;FV.msg=BRAND.ui.nlSearching;render();
      try{
        const list=pool.slice(0,300).map(i=>i._id+" | "+i.titulo+" | "+(i.tipo||"")+" | "+(DOMS[i.dominio]?.name||"")).join("\n");
        const r=await sample.json("From the following inventory of a project's files, pick the ones the person wants to "+(quitar?"remove from":"add to")+" favorites. Reply ONLY with JSON {\"ids\": [exact ids from the list], \"question\": empty string, or a short question if it is unclear}. Reply in the language of the request.\n\nRequest: "+text+"\n\nInventory (id | title | type | domain):\n"+list,{modelTier:"quick",cache:false});
        const ids=r&&Array.isArray(r.ids)?r.ids.map(String):[];
        hits=pool.filter(i=>ids.includes(i._id));
        const ask=r&&(r.question||r.duda);if(!hits.length&&ask){FV.busy=false;FV.msg=String(ask);render();return}
      }catch(e){}
      FV.busy=false;
    }
  }
  if(!hits.length){FV.msg=BRAND.ui.nlNone;render();return}
  if(hits.length>1&&hits.length<=8&&toks.length){FV.matches=hits;FV.msg=tr(BRAND.ui.nlSome,{n:hits.length});render();return}
  if(hits.length>8){FV.matches=hits.slice(0,8);FV.msg=BRAND.ui.nlMany;render();return}
  const it=hits[0];
  if(quitar===isFav(it)){const ok=await setFav(it._id,!quitar);if(ok){FV.msg=tr(quitar?BRAND.ui.nlRemoved:BRAND.ui.nlAdded,{t:it.titulo});FV.text=""}}
  else FV.msg=tr(quitar?BRAND.ui.nlNotFav:BRAND.ui.nlAlready,{t:it.titulo});
  render();
}

async function doAssign(id,pname,undo){
  const p=SB.people.find(x=>x.name===pname);

  try{
    const mcp=ST.mcp||await claude.use("mcp");
    if(!mcp)throw{code:"capability_disabled"};
    const res=await mcp.callTool(SB.linearServer,"save_issue",{id,assignee:undo?null:p.assignee});
    const pl=typeof res.payload==="string"?safeJson(res.payload):res.payload;
    const got=pl&&pl.assigneeId?pl.assigneeId:null;
    if(undo)ST.assign[id]=got?{status:"idle",msg:"Linear still shows an owner. Check the issue."}:{status:"idle",msg:""};
    else ST.assign[id]=got===p.assignee?{status:"done",person:pname,msg:""}:{status:"idle",msg:"Linear did not confirm the owner. Check the issue."};
    if(undo?!got:got===p.assignee)patchLive(id,undo?{assignee:null}:{assignee:(typeof pl.assignee==="string"&&pl.assignee)?pl.assignee:(p.match[0]||p.name)});
    mcp.invalidate(SB.linearServer,"list_issues").catch(()=>{});

  render();
}

// Cruza un punto del snapshot con Linear en vivo: cerrado en Linear, o atraso recalculado a hoy.
function liveState(it){
  if(!ST.live)return null;
  const refs=(it.refs||[]).map(r=>r.id).filter(id=>id&&id!=="PRJ");
  const found=refs.map(liveIssue).filter(Boolean);
  if(!found.length)return null;
  const closed=found.every(i=>["completed","canceled"].includes(i.statusType));
  if(closed)return {done:true,label:found.some(i=>i.statusType==="completed")?"Done in Linear":"Canceled in Linear"};
  const open=found.find(i=>!["completed","canceled"].includes(i.statusType));
  const t=todayISO(),due=open&&open.dueDate;
  const late=due&&due<t?Math.round((new Date(t+"T12:00:00")-new Date(due+"T12:00:00"))/864e5):0;
  return {done:false,due:due||"",late,status:open&&open.status};
}

}

function liveHtml(d){

    const t=todayISO(),end=addBD(t,5),ov=d.owner_overrides||{},by={};

      if(["completed","canceled"].includes(i.statusType))return;
      const o=ov[i.id]||personOf(i.assignee);

}

  const tabs=ST.docs.length>1?`<div class="tabs" role="group" aria-label="Day">${ST.docs.slice(0,15).map(x=>`<button type="button" data-day="${esc(x.date)}" aria-pressed="${x.date===d.date}" aria-label="${esc(dayLabel(x.date))}">${esc(x.date.slice(5))}</button>`).join("")}</div>`:"";
  const age=d===latest()?snapAge(d):0;
  const stale=age>0?`<span class="tipw"><button type="button" class="sdot" aria-describedby="tip-stale" aria-label="Snapshot out of date"><i></i></button><span class="tip" role="tooltip" id="tip-stale">Snapshot from ${esc(d.date)}, ${age} day${age>1?"s":""} old: the nightly run did not update it. Issues closed in Linear already show as done. Wait for tonight's ${esc(SB.scheduleTime)} run, or ask Claude to run the scheduled task "${esc(SB.scheduleName)}" now.</span></span>`:"";
  const hd=`<div class="shead"><h1><span class="h1ic">${ic("status")}</span>Daily status</h1>${stale}${d===latest()?refreshIcon():""}</div>`;
  return hd+(d===latest()?refreshErr():"")+tabs+`<section class="sum" aria-labelledby="hl"><p class="eyebrow2"><span class="health">${esc(HEALTH[d.health]||"")}</span> · <time>${esc(dayLabel(d.date))}</time></p><p class="hl" id="hl">${esc(d.headline||"")}</p>${d.health_reason?`<p class="why">${esc(d.health_reason)}</p>`:""}<p class="counts"><span><b>${lc?lc.open:(c.open??0)}</b> open</span><span><b>${lc?lc.over:(c.overdue??0)}</b> overdue</span><span><b>${lc?lc.un:(c.unassigned??0)}</b> unassigned</span><span><b>${c.changed??0}</b> changed</span></p></section>
  <div class="sec">${(d.urgent||[]).length?accHtml("acc-urg","Urgent today",`${d.urgent.length} item${d.urgent.length>1?"s":""}${(()=>{const k=d.urgent.filter(u=>(liveState(u)||{}).done).length;return k?` · ${k} done`:""})()}`,urgentHtml(d)):""}${weekAccHtml(d)}${msAccHtml(d)}${fullHtml(d)}</div>`;
}
function stripHtml(){
  const d=latest();if(!d)return"";
  return `<section class="strip" aria-label="Daily status"><p class="eyebrow2">Daily status · <span class="health">${esc(HEALTH[d.health]||"")}</span> · <time>${esc(d.date)}</time></p><p class="sh">${esc(d.headline||"")}</p>${snapAge(d)>0?`<p class="stale">Snapshot from <time>${esc(d.date)}</time>, ${snapAge(d)} day${snapAge(d)>1?"s":""} old.</p>`:""}${(d.urgent||[]).length?`<ol class="su">${d.urgent.map(u=>{const ls=liveState(u);return `<li${ls&&ls.done?' class="isdone"':""}><span>${esc(u.text)}</span><em>${ls&&ls.done?esc(ls.label):esc(u.owner||"")}</em></li>`}).join("")}</ol>`:""}<div class="acts"><button type="button" class="btn pri" data-go="status">Open Daily status</button>${refreshBar()}</div></section>`;
}

function render0(){
  if(!loaded){$("#nav").innerHTML="";$("#view").innerHTML=`<div class="empty"><strong>${esc(BRAND.ui.loading)}</strong>${esc(BRAND.ui.loadingHint)}</div>`;return}
  if(!items.length){$("#nav").innerHTML="";$("#view").innerHTML=`<div class="empty"><strong>${esc(BRAND.ui.emptyTitle)}</strong>${esc(BRAND.ui.emptyBody)}</div>`;return}
  renderNav();
  document.body.classList.toggle("fsv",cur==="board"&&!!SB&&!q);
  $("#view").innerHTML=q?viewSearch():cur==="inicio"?viewHome():cur==="favoritos"?viewFavs():cur==="status"&&SB?viewStatus():cur==="board"&&SB?viewBoard():viewDomain(cur);
}
function render(){
  hideTip();
  if(ST.dragging){ST.pendRender=true;return}
  const a=document.activeElement,fid=a&&a.dataset?a.dataset.fid:null;
  render0();
  if(fid){const el=document.querySelector('[data-fid="'+fid+'"]');if(el)el.focus()}
}
function go(d){cur=d;if((d==="status"||d==="board")&&SB)openStatus();showOld=false;q="";$("#q").value="";render();window.scrollTo({top:0})}
document.addEventListener("click",e=>{
  const t=e.target;
  let b;
  if(b=t.closest("[data-day]")){ST.sel=b.dataset.day;render();return}
  if(b=t.closest("[data-copy]")){copyText(PR[b.dataset.copy]||"",b.dataset.copy);return}
  if(b=t.closest("[data-draft]")){draftFor(b.dataset.draft);return}
  if(b=t.closest("[data-dcopy]")){const k=b.dataset.dcopy;const dr=ST.drafts[k];if(dr){copyText(dr.text,"d"+k)}return}
  if(b=t.closest("[data-dclose]")){delete ST.drafts[b.dataset.dclose];render();return}
  if(b=t.closest("[data-assign]")){doAssign(b.dataset.assign,b.dataset.p,false);return}
  if(b=t.closest("[data-undo]")){doAssign(b.dataset.undo,"",true);return}
  if(b=t.closest("[data-fav]")){const it=items.find(i=>i._id===b.dataset.fav);if(it){FV.msg="";FV.err=false;setFav(it._id,!isFav(it))}return}
  if(b=t.closest("[data-favmove]")){moveFav(b.dataset.favmove,Number(b.dataset.d));return}
  if(b=t.closest("[data-grp]")){setBoardPref("grp",b.dataset.grp);return}
  if(t.closest("[data-bk]")){setBoardPref("bk",!boardBk());return}
  if(t.closest("[data-refresh]")){refreshLive();return}
  if(b=t.closest("[data-done]")){doDone(b.dataset.done,false);return}
  if(b=t.closest("[data-reopen]")){doDone(b.dataset.reopen,true);return}
  if(b=t.closest("[data-mvundo]")){const id=b.dataset.mvundo;doMove(id,(ST.mv[id]||{}).prev,true);return}
  if(t.closest("[data-allow]")){doAllow();return}
  if(e.target.closest("[data-close]")){closeDrawer();return}
  const o=e.target.closest(".info[data-open]");if(o){openId=o.dataset.open;drawer();return}
  const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);return}
  const a=e.target.closest("[data-aud]");if(a){aud=a.dataset.aud;render();return}
  if(e.target.closest("[data-old]")){showOld=!showOld;render()}
});
document.addEventListener("submit",e=>{if(e.target.closest("[data-favform]")){e.preventDefault();const v=$("#favq")?$("#favq").value:"";favPrompt(v)}});
document.addEventListener("change",e=>{
  const t=e.target;if(!t||!t.closest)return;let c;
  if(c=t.closest("[data-wkst]")){wkToggle(c.dataset.wkst,c.checked);return}
  if(c=t.closest("[data-mv]")){doMove(c.dataset.mv,c.value,false);return}
  if(c=t.closest("[data-asg]")){if(c.value==="__none")doAssign(c.dataset.asg,"",true);else if(c.value)doAssign(c.dataset.asg,c.value,false)}
});
const tipEl=document.createElement("div");tipEl.id="ktip";tipEl.setAttribute("role","tooltip");tipEl.hidden=true;document.body.appendChild(tipEl);
function hideTip(){tipEl.hidden=true}
function showTip(card,anchor){
  const i=liveIssue(card.dataset.card);const d=shortDesc(i&&i.description);
  tipEl.textContent=d||"No description.";tipEl.hidden=false;
  const r=anchor.getBoundingClientRect(),h=tipEl.offsetHeight,w=tipEl.offsetWidth;
  const top=r.bottom+6+h>innerHeight?Math.max(8,r.top-6-h):r.bottom+6;
  tipEl.style.top=top+"px";tipEl.style.left=Math.min(Math.max(8,r.left),innerWidth-w-8)+"px";
}
document.addEventListener("mouseover",e=>{const t=e.target.closest&&e.target.closest(".kttl");if(t&&!ST.dragging)showTip(t.closest("[data-card]"),t)});
document.addEventListener("mouseout",e=>{const t=e.target.closest&&e.target.closest(".kttl");if(t&&!(e.relatedTarget&&t.contains(e.relatedTarget)))hideTip()});
document.addEventListener("focusin",e=>{const c=e.target;if(c&&c.matches&&c.matches("[data-card]"))showTip(c,c);else hideTip()});
document.addEventListener("focusout",hideTip);
window.addEventListener("scroll",hideTip,true);
document.addEventListener("keydown",e=>{
  if(!e.altKey||(e.key!=="ArrowLeft"&&e.key!=="ArrowRight"))return;
  const c=e.target.closest&&e.target.closest("[data-card]");if(!c)return;
  const cell=c.closest(".kcell"),cells=[...cell.parentNode.children],k=cells[cells.indexOf(cell)+(e.key==="ArrowRight"?1:-1)];
  if(!k||!k.dataset.st)return;e.preventDefault();doMove(c.dataset.card,k.dataset.st,false);
});
function endDrag(){const p=ST.pendRender;ST.dragId=null;ST.dragging=false;ST.pendRender=false;document.querySelectorAll(".kcell.over,.kcard.dragging").forEach(x=>x.classList.remove("over","dragging"));if(p)render()}
document.addEventListener("dragstart",e=>{const c=e.target.closest&&e.target.closest("[data-card]");if(!c)return;ST.dragId=c.dataset.card;ST.dragging=true;hideTip();try{e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",ST.dragId)}catch(_){}c.classList.add("dragging")});
document.addEventListener("dragover",e=>{const k=e.target.closest&&e.target.closest(".kcell");if(!k||!ST.dragId)return;e.preventDefault();try{e.dataTransfer.dropEffect="move"}catch(_){}document.querySelectorAll(".kcell.over").forEach(x=>{if(x!==k)x.classList.remove("over")});k.classList.add("over")});
document.addEventListener("drop",e=>{const k=e.target.closest&&e.target.closest(".kcell");if(!k||!ST.dragId)return;e.preventDefault();const id=ST.dragId,st=k.dataset.st;endDrag();doMove(id,st,false)});
document.addEventListener("dragend",endDrag);
document.addEventListener("input",e=>{if(e.target&&e.target.id==="favq")FV.text=e.target.value});
document.addEventListener("toggle",e=>{const id=e.target&&e.target.id;if(id==="full"||id==="acc-ms"||id==="acc-week"||id==="acc-urg")ST.acc[id]=e.target.open},true);
$("#q").addEventListener("input",e=>{q=e.target.value.trim().toLowerCase();render()});
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement!==$("#q")){e.preventDefault();$("#q").focus()}if(e.key==="Escape"){if(openId){closeDrawer();return}if(q){q="";$("#q").value="";render();return}if(cur==="board")go("status")}
});

(async()=>{
  const db=await claude.use("db");DB=db;
  if(!db){ST.loaded=true;$("#view").innerHTML=`<div class="empty"><strong>${esc(BRAND.ui.dbClosedTitle)}</strong>${esc(BRAND.signin)}</div>`;return}
  render();const h=location.hash.slice(1);if(DOMS[h]||h==="favoritos")cur=h;else if((h==="status"||h==="board")&&SB){cur=h;openStatus()}
  db.collection("items").onSnapshot(s=>{loaded=true;items=s.docs.map(d=>{const it=Object.assign({},d.data(),{_id:d.id});if(!DOMS[it.dominio])it.dominio=LAYERS[0].doms[0];return it});render();if(openId)drawer()},
    ()=>{$("#view").innerHTML=`<div class="empty"><strong>${esc(BRAND.ui.dbStoppedTitle)}</strong>${esc(BRAND.ui.reload)}</div>`});
  if(SB){
    try{const pm=await claude.use("permissions");const st=pm?await pm.state("mcp:"+SB.linearServer):"unavailable";if(st==="granted")startLive()}catch(_){}
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&ST.live&&Date.now()-ST.live.at>120000)refreshLive()});
  }
  if(SB)db.collection("status").onSnapshot(s=>{ST.loaded=true;ST.docs=s.docs.map(d=>{const o=Object.assign({},d.data(),{_id:d.id});o.date=o.date||d.id;["urgent","waiting","next","decisions","gaps"].forEach(k=>{if(Array.isArray(o[k]))o[k]=o[k].map(normItem)});return o}).sort((a,b)=>String(b.date).localeCompare(String(a.date)));if(!ST.sel||!ST.docs.some(x=>x.date===ST.sel))ST.sel=ST.docs[0]?ST.docs[0].date:null;render()},()=>{ST.loaded=true;ST.err=true;render()});
})();
</script>


</body></html>
